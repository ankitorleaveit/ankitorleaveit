name: profile scan

on:
  schedule:
    - cron: "17 2 * * *"      # 02:17 UTC daily (~07:47 IST)
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    paths:
      - "scripts/build_panels.py"
      - ".github/workflows/profile-scan.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render panels from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_panels.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan.svg stack.svg activity.svg telemetry.svg
          if git diff --staged --quiet; then
            echo "panels unchanged"
          else
            git commit -m "chore: refresh profile scan panels"
            git push
          fi
